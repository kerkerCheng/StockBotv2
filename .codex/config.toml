# StockBotv2 本機 routine 的最小權限 profile。
# 新 task／scheduled run 在 sandbox 內直接存取已知 authority 網域，
# 避免先留下 access_blocked／stale state 再以升權重跑補救。
default_permissions = "stockbot-daily"

[permissions.stockbot-daily]
description = "StockBotv2 workspace access with a Daily Brief domain allowlist."
extends = ":workspace"

[permissions.stockbot-daily.filesystem.":workspace_roots"]
# routine 必須讀本機 secrets，但不得在排程內改寫它們。
".env" = "read"

[permissions.stockbot-daily.network]
enabled = true
# Neo4j authority 位於 localhost；仍只允許下方明列的 local literal。
allow_local_binding = true

[permissions.stockbot-daily.network.domains]
# Engine B：X API／media 與 SEC EDGAR。
"api.x.com" = "allow"
"pbs.twimg.com" = "allow"
"data.sec.gov" = "allow"
"efts.sec.gov" = "allow"
"www.sec.gov" = "allow"

# Engine C：Yahoo Finance 與 TWSE official freshness。
"query1.finance.yahoo.com" = "allow"
"query2.finance.yahoo.com" = "allow"
"finance.yahoo.com" = "allow"
"consent.yahoo.com" = "allow"
"fc.yahoo.com" = "allow"
"guce.yahoo.com" = "allow"
"openapi.twse.com.tw" = "allow"

# Engine D／Capital Authority：Google service-account token 與 Sheets read-only。
"oauth2.googleapis.com" = "allow"
"sheets.googleapis.com" = "allow"
"www.googleapis.com" = "allow"

# 本機 authorities 與 fixed outbound publishers。
"localhost" = "allow"
"127.0.0.1" = "allow"
"github.com" = "allow"
"api.github.com" = "allow"
"discord.com" = "allow"
"discordapp.com" = "allow"
