[pytest]
# cache_dir 指向 ignored 的 .pytest_tmp/，而不是預設的 .pytest_cache/。
#
# 原因：repo 內的 .pytest_cache 與 %LOCALAPPDATA%\Temp\pytest-of-<user> 都曾被某次
# 以較高權限執行的 pytest 建立，一般使用者連 icacls 都讀不到（Access is denied），
# 且本機帳號非系統管理員，無法刪除或修復其 ACL。症狀是每次執行都出現
# `could not create cache path ... [WinError 183]`。
#
# temp root 的同型問題由 tests/conftest.py 偵測後改道；那邊刻意寫成「偵測到不可用才
# 改道」，所以之後若以系統管理員刪掉那兩個目錄，行為會自動回到 pytest 預設。
cache_dir = .pytest_tmp/cache
#
# testpaths（2026-10-28）：只收 tests/。不給的話 pytest 會從 rootdir 往下收所有 `*_test.py`——
# 那天 `library/private/wf_tmp/send_discord_test.py`（某個 session 的手動發送腳本，import 時就讀 sys.argv、
# 換掉 sys.stdout）被收進來，整個套件「no tests ran」；argv 剛好對得上時它會真的發 Discord。
# 被追蹤的測試全在 tests/（`git ls-files | grep _test.py` 在 tests/ 以外是 0）。
testpaths = tests
