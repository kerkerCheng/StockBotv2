services:
  postgres:
    image: postgres:16-alpine
    container_name: stockbot-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=stockbot
      - POSTGRES_USER=stockbot
      - POSTGRES_PASSWORD=stockbot_dev_pw
    volumes:
      - ./.postgres/data:/var/lib/postgresql/data
      - ./engine_c/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockbot -d stockbot"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5.26-community
    container_name: stockbot-neo4j
    ports:
      - "7474:7474"   # Browser
      - "7687:7687"   # Bolt
    environment:
      - NEO4J_AUTH=neo4j/c4780647
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
    volumes:
      - ./.neo4j/data:/data
      - ./.neo4j/logs:/logs
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "stockbot_dev_pw", "RETURN 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
